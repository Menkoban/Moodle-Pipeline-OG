<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="666" height="300" fill="#ffffff"/>
  <text x="333" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Der Spiralbohrer und seine Teile</text>

  <!-- Schaft -->
  <rect x="80" y="140" width="130" height="34" fill="#dfe3e8" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Körper mit Spiralnuten -->
  <rect x="210" y="140" width="290" height="34" fill="#b7bcc2" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#5f6368" stroke-width="2">
    <line x1="228" y1="174" x2="266" y2="140"/>
    <line x1="278" y1="174" x2="316" y2="140"/>
    <line x1="328" y1="174" x2="366" y2="140"/>
    <line x1="378" y1="174" x2="416" y2="140"/>
    <line x1="428" y1="174" x2="466" y2="140"/>
  </g>
  <!-- Spitze (geschlossen) -->
  <polygon points="500,140 548,157 500,174" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="140" x2="548" y2="157" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Beschriftungen (Hinweislinien enden am Text) -->
  <text x="105" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">Schaft</text>
  <line x1="140" y1="140" x2="128" y2="104" stroke="#5f6368" stroke-width="1.2"/>
  <text x="300" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">Spiralnuten (führen die Späne ab)</text>
  <line x1="350" y1="140" x2="350" y2="104" stroke="#5f6368" stroke-width="1.2"/>
  <text x="470" y="240" font-size="13" font-weight="bold" fill="#1a1a1a">Hauptschneiden an der Spitze</text>
  <line x1="524" y1="166" x2="530" y2="230" stroke="#5f6368" stroke-width="1.2"/>
  <text x="130" y="240" font-size="13" font-weight="bold" fill="#1a1a1a">Einspannen bis zum Anschlag</text>
  <line x1="145" y1="174" x2="180" y2="230" stroke="#5f6368" stroke-width="1.2"/>

  <text x="333" y="284" text-anchor="middle" font-size="13" fill="#1a1a1a">Werkstoff HSS (Schnellarbeitsstahl) · Spitzenwinkel für Stahl: 118°</text>
</svg>
