<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="330" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Bohren Schritt für Schritt</text>
  <g>
    <rect x="30" y="60" width="170" height="80" rx="10" fill="#eafaf3" stroke="#1d9e75" stroke-width="2"/>
    <circle cx="58" cy="88" r="16" fill="#1d9e75"/><text x="58" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
    <text x="82" y="84" font-size="13" fill="#0f6e56">Brille auf,</text><text x="82" y="102" font-size="13" fill="#0f6e56">spannen,</text><text x="82" y="120" font-size="13" fill="#0f6e56">ankörnen</text>

    <rect x="215" y="60" width="170" height="80" rx="10" fill="#eafaf3" stroke="#1d9e75" stroke-width="2"/>
    <circle cx="243" cy="88" r="16" fill="#1d9e75"/><text x="243" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
    <text x="267" y="84" font-size="13" fill="#0f6e56">Bohrer rein,</text><text x="267" y="102" font-size="13" fill="#0f6e56">Schlüssel</text><text x="267" y="120" font-size="13" fill="#0f6e56">abziehen!</text>

    <rect x="400" y="60" width="170" height="80" rx="10" fill="#eafaf3" stroke="#1d9e75" stroke-width="2"/>
    <circle cx="428" cy="88" r="16" fill="#1d9e75"/><text x="428" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
    <text x="452" y="93" font-size="13" fill="#0f6e56">Drehzahl</text><text x="452" y="111" font-size="13" fill="#0f6e56">einstellen</text>

    <rect x="30" y="180" width="170" height="80" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="2"/>
    <circle cx="58" cy="208" r="16" fill="#378add"/><text x="58" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
    <text x="82" y="204" font-size="13" fill="#185fa5">Einschalten,</text><text x="82" y="222" font-size="13" fill="#185fa5">gleichmäßig</text><text x="82" y="240" font-size="13" fill="#185fa5">bohren, kühlen</text>

    <rect x="215" y="180" width="170" height="80" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="2"/>
    <circle cx="243" cy="208" r="16" fill="#378add"/><text x="243" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
    <text x="267" y="204" font-size="13" fill="#185fa5">Ausschalten,</text><text x="267" y="222" font-size="13" fill="#185fa5">Stillstand</text><text x="267" y="240" font-size="13" fill="#185fa5">abwarten</text>

    <rect x="400" y="180" width="170" height="80" rx="10" fill="#fbeec9" stroke="#ba7517" stroke-width="2"/>
    <circle cx="428" cy="208" r="16" fill="#ba7517"/><text x="428" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
    <text x="452" y="208" font-size="13" fill="#854f0b">Entgraten</text><text x="452" y="226" font-size="13" fill="#854f0b">&amp; prüfen</text>
  </g>
  <g fill="#9aa0a6"><polygon points="200,100 215,100 207,108"/><polygon points="385,100 400,100 392,108"/><polygon points="200,220 215,220 207,228"/><polygon points="385,220 400,220 392,228"/></g>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#a3322f" font-weight="bold">Schutzbrille tragen · keine Handschuhe · Späne nie mit der Hand</text>
</svg>
