<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Werkstück spannen und ankörnen</text>

  <!-- Panel RICHTIG -->
  <rect x="25" y="50" width="300" height="230" rx="10" fill="#f1faf5" stroke="#1d7a3f" stroke-width="2.5"/>
  <rect x="25" y="50" width="300" height="34" rx="10" fill="#1d7a3f"/>
  <text x="175" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">RICHTIG: gespannt und gekörnt</text>
  <!-- Schraubstock -->
  <rect x="70" y="210" width="210" height="22" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="88" y="170" width="26" height="40" fill="#5f6368" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="236" y="170" width="26" height="40" fill="#5f6368" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="114" y="182" width="122" height="28" fill="#f0c674" stroke="#854f0b" stroke-width="2"/>
  <line x1="262" y1="190" x2="292" y2="190" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="296" cy="190" r="6" fill="#5f6368" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Körner -->
  <polygon points="170,152 180,152 175,170" fill="#b7bcc2" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="168" y="120" width="14" height="32" fill="#dfe3e8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="175" cy="180" r="2.5" fill="#1a1a1a"/>
  <text x="215" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">Körner setzt die</text>
  <text x="215" y="147" font-size="12" font-weight="bold" fill="#1a1a1a">Bohrstelle fest</text>
  <line x1="183" y1="140" x2="210" y2="136" stroke="#5f6368" stroke-width="1.2"/>
  <text x="175" y="262" text-anchor="middle" font-size="12" fill="#1a1a1a">Beide Hände frei · Werkstück kann sich nicht mitdrehen</text>

  <!-- Panel FALSCH -->
  <rect x="355" y="50" width="300" height="230" rx="10" fill="#fdf0ef" stroke="#d8312c" stroke-width="2.5"/>
  <rect x="355" y="50" width="300" height="34" rx="10" fill="#d8312c"/>
  <text x="505" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">FALSCH: mit der Hand gehalten</text>
  <!-- Werkstück lose mit Hand -->
  <rect x="430" y="182" width="122" height="28" fill="#f0c674" stroke="#854f0b" stroke-width="2" transform="rotate(-8 491 196)"/>
  <path d="M 545 196 L 545 176 L 552 171 L 552 163 L 559 160 L 564 165 L 564 158 L 571 155 L 576 161 L 582 161 L 585 169 L 585 190 L 576 200 Z" fill="#e8b98a" stroke="#854f0b" stroke-width="2"/>
  <!-- Drehpfeile (Kurven um das Werkstück, klar oberhalb des Warntextes) -->
  <path d="M 428 150 Q 490 122 552 150" fill="none" stroke="#d8312c" stroke-width="3"/>
  <polygon points="552,150 538,144 542,158" fill="#d8312c"/>
  <path d="M 552 214 Q 490 246 428 214" fill="none" stroke="#d8312c" stroke-width="3"/>
  <polygon points="428,214 442,208 442,220" fill="#d8312c"/>
  <text x="505" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#a3322f">Der Bohrer reißt das Werkstück mit —</text>
  <text x="505" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#a3322f">Verletzungsgefahr!</text>

  <text x="340" y="306" text-anchor="middle" font-size="13" fill="#1a1a1a">Regel: Immer im Maschinenschraubstock spannen und die Bohrstelle vorher ankörnen.</text>
</svg>
