  <ellipse cx="485" cy="108" rx="20" ry="10" fill="#f0c9a8" stroke="#a3322f" stroke-width="1.5"/>
  <g stroke="#854f0b" stroke-width="2"><path d="M 472 92 q 4 -8 8 0"/><path d="M 485 88 q 4 -8 8 0"/><path d="M 497 92 q 4 -8 8 0"/></g>
  <line x1="455" y1="70" x2="515" y2="130" stroke="#d8312c" stroke-width="4"/>
  <circle cx="485" cy="158" r="12" fill="#d8312c"/><path d="M 479 152 l 12 12 M 491 152 l -12 12" stroke="#fff" stroke-width="2.5"/>
  <text x="485" y="195" text-anchor="middle" font-size="13" fill="#a3322f">Späne nie mit Hand</text>
