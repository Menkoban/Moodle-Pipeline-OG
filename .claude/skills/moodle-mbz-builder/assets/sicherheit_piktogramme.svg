<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="230" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Sicherheit beim Bohren</text>

  <!-- Schutzbrille: Gebot -->
