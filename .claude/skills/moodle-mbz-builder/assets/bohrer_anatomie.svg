<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="580" height="300" fill="#ffffff"/>
  <text x="290" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Der Spiralbohrer und seine Teile</text>
  <!-- Schaft -->
  <rect x="60" y="135" width="120" height="44" fill="#c2c7cd" stroke="#3c4043" stroke-width="2"/>
  <!-- Körper mit Spiralnut -->
  <rect x="180" y="135" width="250" height="44" fill="#b0b6bc" stroke="#3c4043" stroke-width="2"/>
  <g stroke="#6b7177" stroke-width="2">
    <line x1="195" y1="135" x2="215" y2="179"/><line x1="225" y1="135" x2="245" y2="179"/>
    <line x1="255" y1="135" x2="275" y2="179"/><line x1="285" y1="135" x2="305" y2="179"/>
    <line x1="315" y1="135" x2="335" y2="179"/><line x1="345" y1="135" x2="365" y2="179"/>
    <line x1="375" y1="135" x2="395" y2="179"/><line x1="405" y1="135" x2="425" y2="179"/>
  </g>
  <!-- Spitze -->
  <polygon points="430,135 430,179 495,157" fill="#8a8f95" stroke="#3c4043" stroke-width="2"/>
  <!-- Spitzenwinkel -->
  <path d="M 460 150 A 30 30 0 0 1 460 164" fill="none" stroke="#1d6e56" stroke-width="2"/>
  <text x="470" y="120" font-size="14" fill="#1d6e56" font-weight="bold">118°</text>
  <line x1="495" y1="157" x2="470" y2="124" stroke="#1d6e56" stroke-width="1"/>
  <!-- Labels -->
  <g font-size="14" fill="#1a1a1a">
    <line x1="120" y1="135" x2="120" y2="95" stroke="#5f6368" stroke-width="1"/><circle cx="120" cy="135" r="3" fill="#5f6368"/>
    <text x="120" y="88" text-anchor="middle">Schaft</text>
    <line x1="300" y1="179" x2="300" y2="225" stroke="#5f6368" stroke-width="1"/><circle cx="300" cy="179" r="3" fill="#5f6368"/>
    <text x="300" y="242" text-anchor="middle">Spiralnut (führt Späne ab)</text>
    <line x1="470" y1="157" x2="520" y2="200" stroke="#5f6368" stroke-width="1"/><circle cx="470" cy="157" r="3" fill="#5f6368"/>
    <text x="525" y="204">Hauptschneide</text>
    <text x="525" y="204" dy="20"> </text>
  </g>
  <text x="525" y="224" font-size="14" fill="#1a1a1a">+ Spitze</text>
</svg>
