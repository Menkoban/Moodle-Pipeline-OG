<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -10 659 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="-56" y="-10" width="659" height="640" fill="#ffffff"/>
  <text x="290" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Aufbau einer Standbohrmaschine</text>

  <!-- Fußplatte -->
  <polygon points="150,592 330,592 350,612 130,612" fill="#7a7f86" stroke="#3c4043" stroke-width="2"/>
  <!-- Säule -->
  <rect x="222" y="250" width="36" height="345" fill="#c2c7cd" stroke="#3c4043" stroke-width="2"/>
  <rect x="222" y="250" width="10" height="345" fill="#aeb4ba"/>
  <!-- Bohrtisch -->
  <rect x="168" y="452" width="150" height="20" rx="3" fill="#9aa0a6" stroke="#3c4043" stroke-width="2"/>
  <rect x="236" y="448" width="20" height="10" fill="#7a7f86"/>
  <!-- Maschinenschraubstock -->
  <rect x="206" y="424" width="74" height="28" rx="2" fill="#5f6368" stroke="#3c4043" stroke-width="2"/>
  <rect x="236" y="414" width="22" height="14" fill="#cfd3d7" stroke="#3c4043" stroke-width="1.5"/>
  <!-- Maschinenkopf -->
  <rect x="158" y="196" width="200" height="64" rx="6" fill="#c2c7cd" stroke="#3c4043" stroke-width="2"/>
  <!-- Motor hinten -->
  <rect x="330" y="180" width="70" height="58" rx="8" fill="#9aa0a6" stroke="#3c4043" stroke-width="2"/>
  <!-- Riemenabdeckung -->
  <rect x="190" y="150" width="120" height="50" rx="12" fill="#d7dbe0" stroke="#3c4043" stroke-width="2"/>
  <!-- Spindel -->
  <rect x="236" y="260" width="20" height="78" fill="#cfd3d7" stroke="#3c4043" stroke-width="1.5"/>
  <!-- Bohrfutter -->
  <polygon points="230,338 262,338 256,372 236,372" fill="#8a8f95" stroke="#3c4043" stroke-width="2"/>
  <!-- Bohrer -->
  <rect x="242" y="372" width="8" height="52" fill="#b0b6bc" stroke="#3c4043" stroke-width="1.5"/>
  <polygon points="242,424 250,424 246,432" fill="#5f6368"/>
  <!-- Vorschubhebel -->
  <circle cx="372" cy="226" r="9" fill="#5f6368" stroke="#3c4043" stroke-width="2"/>
  <line x1="372" y1="226" x2="372" y2="188" stroke="#3c4043" stroke-width="4"/>
  <line x1="372" y1="226" x2="410" y2="240" stroke="#3c4043" stroke-width="4"/>
  <line x1="372" y1="226" x2="408" y2="208" stroke="#3c4043" stroke-width="4"/>
  <circle cx="372" cy="184" r="6" fill="#3c4043"/>
  <circle cx="414" cy="242" r="6" fill="#3c4043"/>
  <circle cx="412" cy="205" r="6" fill="#3c4043"/>
  <!-- Not-Aus -->
  <rect x="168" y="228" width="34" height="26" rx="4" fill="#fde2e1" stroke="#a3322f" stroke-width="2"/>
  <circle cx="185" cy="241" r="8" fill="#d8312c" stroke="#7a1c1a" stroke-width="2"/>

  <!-- Leader lines + labels (rechts) -->
  <g font-size="14" fill="#1a1a1a">
    <line x1="250" y1="160" x2="470" y2="120" stroke="#5f6368" stroke-width="1"/><circle cx="250" cy="160" r="3" fill="#5f6368"/>
    <text x="476" y="124">Riemenabdeckung</text>
    <line x1="365" y1="205" x2="470" y2="170" stroke="#5f6368" stroke-width="1"/><circle cx="365" cy="205" r="3" fill="#5f6368"/>
    <text x="476" y="174">Motor</text>
    <line x1="390" y1="226" x2="470" y2="220" stroke="#5f6368" stroke-width="1"/><circle cx="390" cy="226" r="3" fill="#5f6368"/>
    <text x="476" y="224">Vorschubhebel</text>
    <line x1="256" y1="295" x2="470" y2="290" stroke="#5f6368" stroke-width="1"/><circle cx="256" cy="295" r="3" fill="#5f6368"/>
    <text x="476" y="294">Spindel</text>
    <line x1="258" y1="354" x2="470" y2="350" stroke="#5f6368" stroke-width="1"/><circle cx="258" cy="354" r="3" fill="#5f6368"/>
    <text x="476" y="354">Bohrfutter</text>
    <line x1="250" y1="398" x2="470" y2="410" stroke="#5f6368" stroke-width="1"/><circle cx="250" cy="398" r="3" fill="#5f6368"/>
    <text x="476" y="414">Bohrer</text>
  </g>
  <!-- Leader lines + labels (links) -->
  <g font-size="14" fill="#1a1a1a" text-anchor="end">
    <line x1="158" y1="214" x2="110" y2="150" stroke="#5f6368" stroke-width="1"/><circle cx="158" cy="214" r="3" fill="#5f6368"/>
    <text x="104" y="154">Maschinenkopf</text>
    <line x1="168" y1="241" x2="110" y2="241" stroke="#a3322f" stroke-width="1"/><circle cx="168" cy="241" r="3" fill="#a3322f"/>
    <text x="104" y="245" fill="#a3322f">Not-Aus-Schalter</text>
    <line x1="206" y1="438" x2="110" y2="430" stroke="#5f6368" stroke-width="1"/><circle cx="206" cy="438" r="3" fill="#5f6368"/>
    <text x="104" y="434">Maschinenschraubstock</text>
    <line x1="168" y1="462" x2="110" y2="486" stroke="#5f6368" stroke-width="1"/><circle cx="168" cy="462" r="3" fill="#5f6368"/>
    <text x="104" y="490">Bohrtisch</text>
    <line x1="222" y1="540" x2="110" y2="540" stroke="#5f6368" stroke-width="1"/><circle cx="222" cy="540" r="3" fill="#5f6368"/>
    <text x="104" y="544">Säule</text>
    <line x1="150" y1="600" x2="110" y2="588" stroke="#5f6368" stroke-width="1"/><circle cx="150" cy="600" r="3" fill="#5f6368"/>
    <text x="104" y="592">Fußplatte</text>
  </g>
</svg>
