  </g>  <path d="M 80 45 L 650 45" class="wire-thick" stroke="var(--leiter-l)" stroke-width="5"/>  <path d="M 80 75 L 650 75" class="wire-thick" stroke="var(--leiter-l)" stroke-width="5"/>  <path d="M 80 105 L 650 105" class="wire-thick" stroke="var(--leiter-l)" stroke-width="5"/>  <path d="M 140 45 L 140 160" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 200 75 L 200 160" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 260 105 L 260 160" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 140 280 L 140 300" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 200 280 L 200 300" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 260 280 L 260 300" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 140 420 L 200 470" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 200 420 L 200 470" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 260 420 L 200 470" class="wire" stroke="var(--wid)" stroke-width="5"/>  <path d="M 380 440 L 500 440" class="wire" stroke="var(--wid)" stroke-width="5"/>  <circle class="knoten" cx="140" cy="45" r="7" fill="var(--wid)"/>  <circle class="knoten" cx="200" cy="75" r="7" fill="var(--wid)"/>  <circle class="knoten" cx="260" cy="105" r="7" fill="var(--wid)"/>  <circle class="knoten" cx="380" cy="440" r="7" fill="var(--wid)"/>  <circle class="knoten" cx="440" cy="440" r="7" fill="var(--wid)"/>  <circle class="knoten" cx="500" cy="440" r="7" fill="var(--wid)"/>  <text class="leiter" x="40" y="50" text-anchor="start" font-size="24px" font-weight="600">L1</text>  <text class="leiter" x="40" y="80" text-anchor="start" font-size="24px" font-weight="600">L2</text>  <text class="leiter" x="40" y="110" text-anchor="start" font-size="24px" font-weight="600">L3</text>
