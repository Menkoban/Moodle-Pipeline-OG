}
svg { background: #ffffff; }
text { font-family: "IBM Plex Mono", Consolas, "Liberation Mono", monospace; }
text.bmk { font-size: 26px; font-weight: 700; fill: #16232b; }
text.wert { font-size: 22px; font-weight: 500; fill: #5a6b75; }
