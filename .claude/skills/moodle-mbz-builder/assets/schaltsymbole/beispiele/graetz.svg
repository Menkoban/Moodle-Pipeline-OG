<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 14 900 326" width="900" height="326">
<title>Graetz-Brueckengleichrichter</title>
<style>

:root {
  --wid: #16232b;
  --text: #16232b;
  --text2: #5a6b75;
  --strom: #e07a2f;
  --spannung: #2f6fe0;
  --magnet: #d94f9a;
  --ok: #2e8b57;
  --gefahr: #d0392b;
  --leiter-l: #8a3b14;
  --leiter-n: #2f6fe0;
  --leiter-pe: #2e8b57;
}
svg { background: #ffffff; }
text { font-family: "IBM Plex Mono", Consolas, "Liberation Mono", monospace; }
text.bmk { font-size: 26px; font-weight: 700; fill: #16232b; }
text.wert { font-size: 22px; font-weight: 500; fill: #5a6b75; }
text.pin { font-size: 18px; font-weight: 600; fill: #5a6b75; }
text.title { font-size: 28px; font-weight: 700; fill: #16232b; }
text.leiter { font-size: 22px; font-weight: 700; fill: #16232b; }
.wire { fill: none; stroke: #16232b; stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; }
.wire-thick { fill: none; stroke: #16232b; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; }
.wire-pe { fill: none; stroke: #2e8b57; stroke-width: 5px; stroke-dasharray: 12 8; stroke-linecap: round; stroke-linejoin: round; }
.wire-n { fill: none; stroke: #2f6fe0; stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; }
.knoten { fill: #16232b; stroke: none; }
.klemme-dot { fill: #ffffff; stroke: #16232b; stroke-width: 3px; }

</style>
