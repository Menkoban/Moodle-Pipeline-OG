<title>steckdose — Schaltzeichen nach DIN EN 60617</title>
<desc>Bogen, dessen Scheitel die Zuleitung aufnimmt, mit einem Querstrich als Schutzkontakt darüber; ohne den Querstrich wäre es eine Steckdose ohne Schutzkontakt. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 448 (DIN EN 60617-11), Zeile 'Schutzkontaktsteckdose' | Lage: Richtungsfrei: das Zeichen hat keine Vorzugsrichtung (Kreis, Erdungszeichen, Grundrissdarstellung); Lage wie in der Vorlage.</desc>
