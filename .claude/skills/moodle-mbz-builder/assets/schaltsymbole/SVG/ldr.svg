<title>ldr — Schaltzeichen nach DIN EN 60617</title>
<desc>Widerstandsrechteck mit zwei parallelen Pfeilen, die AUF das Bauteil zeigen; zeigten sie weg, wäre es ein lichtaussendendes Bauteil. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 446 (DIN EN 60617-5), Spalte 'Sensoren', Zeile 'Widerstand, lichtempfindlich, Photowiderstand' | Lage: Vorlage bereits waagerecht gezeichnet (Anschluesse links und rechts); Lage unveraendert uebernommen.</desc>
