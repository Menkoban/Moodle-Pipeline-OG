<text class="nm" x="-40" y="108">ldr</text><line class="tl" x1="-40" y1="113" x2="168" y2="113"/><text class="kop" x="-40" y="120">BEDEUTUNG</text><text class="tx" x="-40" y="130">Widerstandsrechteck mit zwei parallelen</text><text class="tx" x="-40" y="140">Pfeilen, die AUF das Bauteil zeigen; zeigten</text><text class="tx" x="-40" y="150">sie weg, wäre es ein lichtaussendendes</text><text class="tx" x="-40" y="160">Bauteil.</text><text class="kop" x="-40" y="169">QUELLE</text><text class="tx" x="-40" y="179">Westermann Tabellenbuch Elektrotechnik,</text><text class="tx" x="-40" y="189">Technische Dokumentation und Formeln, S. 446</text><text class="tx" x="-40" y="199">(DIN EN 60617-5), Spalte 'Sensoren', Zeile</text><text class="tx" x="-40" y="209">'Widerstand, lichtempfindlich,</text><text class="tx" x="-40" y="219">Photowiderstand'</text><text class="kop" x="-40" y="228">LAGE</text><text class="tx" x="-40" y="238">Vorlage bereits waagerecht gezeichnet</text><text class="tx" x="-40" y="248">(Anschluesse links und rechts); Lage</text><text class="tx" x="-40" y="258">unveraendert uebernommen.</text>
