<title>leiterPE — Schaltzeichen nach DIN EN 60617</title>
<desc>Durchgehende Leitung mit einem schrägen Strich, der am oberen Ende einen QUERSTRICH trägt. Punkt und Querstrich sind der ganze Unterschied zwischen N und PE. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 447 (DIN EN 60617-3), Zeile 'Schutzleiter (PE)' | Lage: Richtungsfrei: das Zeichen hat keine Vorzugsrichtung (Kreis, Erdungszeichen, Grundrissdarstellung); Lage wie in der Vorlage.</desc>
