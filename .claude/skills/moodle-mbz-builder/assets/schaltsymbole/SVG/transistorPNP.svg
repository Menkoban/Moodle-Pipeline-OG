<title>transistorPNP — Schaltzeichen nach DIN EN 60617</title>
<desc>Gleicher Aufbau wie der NPN-Transistor, aber der Emitterpfeil zeigt ZUM Basisstrich hin — die Pfeilrichtung ist der ganze Unterschied. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 446 (DIN EN 60617-5), Zeile 'PNP-Transistor' | Lage: Vorlage bereits waagerecht gezeichnet (Anschluesse links und rechts); Lage unveraendert uebernommen.</desc>
