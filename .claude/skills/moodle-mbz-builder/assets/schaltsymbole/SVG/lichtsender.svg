<title>lichtsender — Schaltzeichen nach DIN EN 60617</title>
<desc>Kasten mit dem Strahlungszeichen und der Leuchte. Zusammen mit dem Lichtempfänger bildet er die Lichtschranke. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 450 (DIN EN 60617-8), Zeile 'Lichtsender, Gleichlichtsender' | Lage: Richtungsfrei: das Zeichen hat keine Vorzugsrichtung (Kreis, Erdungszeichen, Grundrissdarstellung); Lage wie in der Vorlage.</desc>
