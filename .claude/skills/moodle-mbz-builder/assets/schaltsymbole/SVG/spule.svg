<title>spule — Schaltzeichen nach DIN EN 60617</title>
<desc>Vier gleich große Halbkreisbögen in einer Reihe, alle nach derselben Seite gewölbt; ein gefülltes Rechteck wäre die frühere, zurückgezogene Form. | Quelle: Westermann Tabellenbuch Elektrotechnik, Technische Dokumentation und Formeln, S. 446 (DIN EN 60617-4), Zeile 'Induktivität, Spule, Wicklung, Drossel — bevorzugte Form' | Lage: Vorlage bereits waagerecht gezeichnet (Anschluesse links und rechts); Lage unveraendert uebernommen.</desc>
