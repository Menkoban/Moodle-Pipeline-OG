<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Werkstück sicher spannen</text>

  <!-- RICHTIG -->
  <rect x="20" y="50" width="270" height="260" rx="8" fill="#eafaf3" stroke="#1d9e75" stroke-width="2"/>
  <circle cx="55" cy="82" r="16" fill="#1d9e75"/>
  <path d="M 47 82 l 6 7 l 12 -14" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="82" y="88" font-size="17" font-weight="bold" fill="#0f6e56">Richtig</text>
  <!-- Bohrtisch -->
  <rect x="60" y="250" width="190" height="16" fill="#9aa0a6" stroke="#3c4043" stroke-width="2"/>
  <!-- Schraubstock -->
  <rect x="95" y="220" width="120" height="30" fill="#5f6368" stroke="#3c4043" stroke-width="2"/>
  <rect x="140" y="206" width="30" height="18" fill="#cfd3d7" stroke="#3c4043" stroke-width="1.5"/>
  <!-- Bohrer -->
  <rect x="151" y="150" width="8" height="56" fill="#b0b6bc" stroke="#3c4043" stroke-width="1.5"/>
  <polygon points="151,206 159,206 155,214" fill="#5f6368"/>
  <text x="155" y="296" text-anchor="middle" font-size="13" fill="#0f6e56">Im Schraubstock fest eingespannt</text>

  <!-- FALSCH -->
  <rect x="310" y="50" width="270" height="260" rx="8" fill="#fdeceb" stroke="#d8312c" stroke-width="2"/>
  <circle cx="345" cy="82" r="16" fill="#d8312c"/>
  <path d="M 338 75 l 14 14 M 352 75 l -14 14" stroke="#fff" stroke-width="3"/>
  <text x="372" y="88" font-size="17" font-weight="bold" fill="#a3322f">Falsch</text>
  <rect x="350" y="250" width="190" height="16" fill="#9aa0a6" stroke="#3c4043" stroke-width="2"/>
  <!-- Werkstück lose -->
  <rect x="420" y="232" width="70" height="14" fill="#cfd3d7" stroke="#3c4043" stroke-width="1.5"/>
  <!-- Hand -->
  <ellipse cx="500" cy="244" rx="26" ry="14" fill="#f0c9a8" stroke="#a3322f" stroke-width="2"/>
  <!-- Bohrer -->
  <rect x="441" y="176" width="8" height="56" fill="#b0b6bc" stroke="#3c4043" stroke-width="1.5"/>
  <polygon points="441,232 449,232 445,240" fill="#5f6368"/>
  <text x="445" y="296" text-anchor="middle" font-size="13" fill="#a3322f">Mit der Hand gehalten – Gefahr!</text>
</svg>
