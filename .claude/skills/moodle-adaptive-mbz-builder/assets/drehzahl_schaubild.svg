<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Drehzahl richtig wählen</text>
  <text x="300" y="52" text-anchor="middle" font-size="14" fill="#5f6368">Faustregel: kleiner Bohrer = schnell · großer Bohrer = langsam</text>

  <!-- kleiner Bohrer -->
  <rect x="60" y="90" width="200" height="150" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="2"/>
  <rect x="156" y="110" width="6" height="70" fill="#5f6368"/>
  <polygon points="156,180 162,180 159,188" fill="#5f6368"/>
  <text x="160" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#185fa5">kleiner Ø (3 mm)</text>
  <text x="160" y="230" text-anchor="middle" font-size="15" fill="#185fa5">hohe Drehzahl ~1500 min⁻¹</text>
  <g stroke="#378add" stroke-width="2" fill="none"><path d="M 110 150 a 12 12 0 1 1 -2 -8"/><path d="M 210 150 a 12 12 0 1 1 -2 -8"/></g>

  <!-- großer Bohrer -->
  <rect x="340" y="90" width="200" height="150" rx="8" fill="#fbeec9" stroke="#ba7517" stroke-width="2"/>
  <rect x="432" y="110" width="16" height="70" fill="#5f6368"/>
  <polygon points="432,180 448,180 440,192" fill="#5f6368"/>
  <text x="440" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#854f0b">großer Ø (10 mm)</text>
  <text x="440" y="230" text-anchor="middle" font-size="15" fill="#854f0b">niedrige Drehzahl ~500 min⁻¹</text>
  <g stroke="#ba7517" stroke-width="2" fill="none"><path d="M 395 150 a 16 16 0 1 1 -3 -10"/></g>

  <!-- Tabelle -->
  <text x="60" y="278" font-size="13" font-weight="bold" fill="#1a1a1a">Richtwerte Stahl:</text>
  <g font-size="13" fill="#1a1a1a">
    <text x="60" y="300">Ø 3 mm</text><text x="160" y="300">~1500 min⁻¹</text>
    <text x="280" y="300">Ø 6 mm</text><text x="380" y="300">~800 min⁻¹</text>
    <text x="60" y="320">Ø 8 mm</text><text x="160" y="320">~600 min⁻¹</text>
    <text x="280" y="320">Ø 10 mm</text><text x="380" y="320">~500 min⁻¹</text>
  </g>
</svg>
