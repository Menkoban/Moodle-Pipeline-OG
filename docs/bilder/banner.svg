<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Moodle-Pipeline – von der didaktischen Idee zur geprüften Moodle-Kurssicherung</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1250" cy="10" r="150" fill="none" stroke="#f98012" stroke-width="2" opacity="0.25"/>
  <circle cx="1250" cy="10" r="105" fill="none" stroke="#f98012" stroke-width="2" opacity="0.15"/>
  <circle cx="1230" cy="290" r="80" fill="#38bdf8" opacity="0.10"/>

  <!-- Paket-Symbol (.mbz) -->
  <g transform="translate(70 70)">
    <rect width="150" height="150" rx="30" fill="url(#box)"/>
    <path d="M75 30 L118 52 L118 100 L75 122 L32 100 L32 52 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M32 52 L75 74 L118 52 M75 74 L75 122" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M53.5 41 L96.5 63" stroke="#ffffff" stroke-width="5" opacity="0.6"/>
  </g>

  <text x="262" y="132" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">Moodle-Pipeline</text>
  <rect x="736" y="88" width="76" height="46" rx="12" fill="#f98012"/>
  <text x="774" y="121" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">OG</text>
  <text x="264" y="178" font-size="24" fill="#cbd5e1">Von der didaktischen Idee zur geprüften Moodle-Kurssicherung (.mbz)</text>

  <!-- Kette der Skills -->
  <g font-size="16" font-weight="600" fill="#ffffff">
    <rect x="264" y="216" width="150" height="40" rx="20" fill="#0284c7"/>
    <text x="339" y="241" text-anchor="middle">Grill-Me</text>
    <path d="M422 236 h26" stroke="#94a3b8" stroke-width="3"/><path d="M446 229 l10 7 l-10 7 z" fill="#94a3b8"/>
    <rect x="464" y="216" width="214" height="40" rx="20" fill="#7c3aed"/>
    <text x="571" y="241" text-anchor="middle">Builder · linear/adaptiv</text>
    <path d="M686 236 h26" stroke="#94a3b8" stroke-width="3"/><path d="M710 229 l10 7 l-10 7 z" fill="#94a3b8"/>
    <rect x="728" y="216" width="160" height="40" rx="20" fill="#047857"/>
    <text x="808" y="241" text-anchor="middle">Testinstanz</text>
    <path d="M896 236 h26" stroke="#94a3b8" stroke-width="3"/><path d="M920 229 l10 7 l-10 7 z" fill="#94a3b8"/>
    <rect x="938" y="216" width="160" height="40" rx="20" fill="#b45309"/>
    <text x="1018" y="241" text-anchor="middle">Spielwiese</text>
